name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App (types, unit tests, build, browser tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x
      - run: bun install
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: node e2e/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: e2e/output/

  database:
    name: Database (migrations + behaviour tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-db.sh
